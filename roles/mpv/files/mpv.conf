# ============================================================
# MPV Configuration for Jellyfin MPV Shim
# ============================================================
#
# Based on https://carlosfelic.io/misc/best-mpv-config-2026/
#

# Fast profile baseline (Disables heavy quality features globally)
profile=fast

# Default image adjustments
gamma=0
saturation=0
contrast=0
brightness=0

# Logging
log-file=~~/mpv.log
msg-level=all=v

# ============================================================
# Video Renderer
# ============================================================
vo=gpu
gpu-context=wayland
hwdec=vaapi
hwdec-codecs=all

# Prevent stuttering on display
alpha=no
video-sync=none
framedrop=vo
fbo-format=rgba8

# ============================================================
# Scaling Quality
# ============================================================
scale=spline16
cscale=spline16
dscale=mitchell

dither=no
deband=no

# Direct Rendering (Directly writes VA-API frames to VRAM)
vd-lavc-dr=yes

# Fastest possible HDR Tone-Mapping
hdr-compute-peak=no
tone-mapping=clip

# ============================================================
# Subtitles
# ============================================================
sub-font="sans-serif"
sub-font-size=48
sub-color="#FAFAF5"
sub-border-color="#000000"
sub-border-size=2.0
sub-shadow-offset=0
sub-margin-y=22
sub-ass-override=scale

# ============================================================
# Audio
# ============================================================

# Enable HDMI audio passthrough (bitstreaming)
audio-spdif=ac3,dts

# Allow MPV to automatically negotiate PCM format/rate when passthrough isn't used
audio-format=auto
audio-samplerate=0

# Ensure MPV outputs full volume over HDMI
volume=100
volume-max=100

# Do not create a video window for audio files with album art
audio-display=no

# ============================================================
# Jellyfin MPV Shim Behavior
# ============================================================

# Keep file-to-file behavior predictable inside Jellyfin MPV Shim and disable
# extra on-screen UI components that are unnecessary in a dedicated front-end.
reset-on-next-file=all
fullscreen=yes
osc=no
osd-bar=no