# ============================================================
# MPV Configuration for Jellyfin MPV Shim
# ============================================================
#

# Fast profile baseline (Disables heavy quality features globally)
profile=fast

# Default image adjustments
gamma=0
saturation=0
contrast=0
brightness=0

# Logging
# log-file=~~/mpv.log
# msg-level=all=v

# ============================================================
# Video Renderer
# ============================================================
vo=gpu #               TODO: try gpu-next and see how it performs
# gpu-api=vulkan       TODO: try vulkan
gpu-context=wayland
hwdec=vaapi
hwdec-codecs=all

# Prevent stuttering on display
alpha=no
# video-sync=none
# video-sync=audio     TODO: test video-sync audio
framedrop=vo

# ============================================================
# Scaling Quality
# ============================================================
scale=bilinear
cscale=bilinear

# dither-depth=auto    TODO: test diether depth
dither=no #            TODO: comment these out
deband=no #            TODO: comment these out

# Direct Rendering (Directly writes VA-API frames to VRAM)
vd-lavc-dr=yes

# Fastest possible HDR Tone-Mapping
hdr-compute-peak=no
tone-mapping=clip

# ============================================================
# Subtitles
# ============================================================
sub-font="sans-serif"
sub-font-size=48
sub-color="#FAFAF5"
sub-border-color="#000000"
sub-border-size=2.0
sub-shadow-offset=0
sub-margin-y=22
sub-ass-override=scale

# ============================================================
# Audio
# ============================================================

# Enable HDMI audio passthrough (bitstreaming)
audio-spdif=ac3,dts

# Channel mixing for surround sound to properly match available TV channels
# audio-channels=auto       TODO: Test this

# Allow MPV to automatically negotiate PCM format/rate when passthrough isn't used
audio-format=auto
audio-samplerate=0

# Ensure MPV outputs full volume over HDMI
volume=100
volume-max=100

# Do not create a video window for audio files with album art
audio-display=no

# ============================================================
# Jellyfin MPV Shim Behavior
# ============================================================

# Keep file-to-file behavior predictable inside Jellyfin MPV Shim and disable
# extra on-screen UI components that are unnecessary in a dedicated front-end.
reset-on-next-file=all
fullscreen=yes
osc=no
osd-bar=no
