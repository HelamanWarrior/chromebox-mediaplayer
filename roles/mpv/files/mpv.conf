# ============================================================
# MPV Configuration for Jellyfin MPV Shim
# ============================================================
#

profile=fast

# --- Video output ---
vo=gpu
gpu-api=vulkan
gpu-context=waylandkv
hwdec=vaapi
hwdec-codecs=h264,vc1,hevc,vp8,vp9,mpeg2video

# --- Color ---
gamma=0
saturation=0
contrast=0
brightness=0

# --- Subtitles ---
sub-font="sans-serif"
sub-font-size=48
sub-color="#FAFAF5"
sub-border-color="#000000"
sub-border-size=2.0
sub-shadow-offset=0
sub-margin-y=22
sub-ass-override=scale

# --- Audio ---
volume=100
volume-max=100
audio-spdif=ac3,dts

# --- Jellyfin MPV Shim ---
reset-on-next-file=all
fullscreen=yes
osc=yes
osd-bar=yes
