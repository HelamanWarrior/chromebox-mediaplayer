---
- name: Ensure required MPV directories exist
  become: true
  ansible.builtin.file:
    path: "{{ mpv_path }}/scripts"
    state: directory
    owner: "{{ mediabox_user }}"
    group: "{{ mediabox_user }}"
    mode: '0755'

- name: Update MPV configs & scripts
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ mediabox_user }}"
    group: "{{ mediabox_user }}"
    mode: '0644'
  loop:
    - { src: mpv.conf, dest: "{{ mpv_path }}/mpv.conf" }
    - { src: hyprland-autortc.lua, dest: "{{ mpv_path }}/scripts/hyprland-autortc.lua"}

