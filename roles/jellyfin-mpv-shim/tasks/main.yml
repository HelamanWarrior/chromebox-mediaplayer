---
- name: Ensure all directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ mediabox_conf_dir }}"
    - "{{ systemd_user_dir }}"
    - "{{ mpv_jellyfin_shim_path }}"
    - "{{ custom_scripts_dir}}"

- name: Update jellyfin-mpv-shim conf.json
  ansible.builtin.copy:
    src: conf.json
    dest: "{{ mpv_jellyfin_shim_path }}/conf.json"
    owner: "{{ mediabox_user }}"
    group: "{{ mediabox_user }}"
    mode: '0644'

- name: Install bitrate test dependencies
  become: true
  community.general.pacman:
    name:
      - curl
      - jq
      - iproute2
    state: present

- name: Install jellyfin-autobitrate.sh
  ansible.builtin.copy:
    src: jellyfin-autobitrate.sh
    dest: "{{ custom_scripts_dir }}/jellyfin-autobitrate.sh"
    mode: '0755'

- name: Install server URL and API key
  ansible.builtin.template:
    src: jellyfin-autobitrate.env.j2
    dest: "{{ mediabox_conf_dir }}/jellyfin-autobitrate.env"
    mode: '0600'
  no_log: true

- name: Install bitrate service and timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ systemd_user_dir }}/{{ item }}"
    mode: '0644'
  loop:
    - jellyfin-autobitrate.service
    - jellyfin-autobitrate.timer
  notify: Restart bitrate timer

- name: Enable and start the bitrate timer
  ansible.builtin.systemd:
    name: jellyfin-autobitrate.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  
