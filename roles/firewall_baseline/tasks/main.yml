---
- name: Install UFW
  become: true
  community.general.pacman:
    name: ufw
    state: present

- name: Set default UFW incoming policy to deny
  become: true
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set default UFW outgoing policy to allow
  become: true
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow SSH traffic
  become: true
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Enable UFW and ensure it starts on boot
  become: true
  community.general.ufw:
    state: enabled
